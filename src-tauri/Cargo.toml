[package]
name = "wallpaper-downloader"
version = "0.1.0"
description = "A Tauri App"
authors = ["Michael Cummings"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wallpaper_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
arboard = "3"
dirs = "7.0.0"
image = "0.25"
reqwest = { version = "0.13.5", features = ["json", "stream", "form"] }
scraper = { version = "0.29.0", features = ["atomic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard = "2.1.11"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.6.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1"
tracing-subscriber = "0.3"
urlencoding = "2.1.3"
walkdir = "2"
webbrowser = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows = {
    version = "0.58",
    features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"]
}
