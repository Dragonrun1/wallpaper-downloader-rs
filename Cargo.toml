[package]
name = "wallpaper-downloader-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
directories = "6.0.0"
display-info = "0.5.10"
fastrand = "2.5.0"
httpdate = "1.0.3"
imagesize = "0.15.0"
more-wallpapers = { version = "0.4.0", features = ["fallback"] }
reqwest = { version = "0.13.5", features = ["form", "json", "query"] }
rfd = "0.18.0"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", features = ["system-tray"] }
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "time"] }
toml = "1.2.1"
url = "2.5.8"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true

[dev-dependencies]
http = "1.5.0"
