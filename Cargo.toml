[package]
name = "wallpaper-downloader-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
display-info = "0.5.10"
more-wallpapers = { version = "0.4.0", features = ["fallback"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.18.1", features = ["system-tray"] }
toml = "1.2.1"
fastrand = "2.5.0"
anyhow = "1.0.104"
async-trait = "0.1.92"
serde_json = "1.0.154"
imagesize = "0.15.0"
reqwest = { version = "0.13.5", features = ["json", "query"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs"] }
sys-locale = "0.3.2"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
