[package]
name = "wallpaper-downloader-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.23", features = ["csr"] }
tauri-wasm = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.107", features = ["Window"] }
